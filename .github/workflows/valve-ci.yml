# Valve-focused CI.
#
# The upstream (paradigm) workflows in this directory target Depot runners /
# external infra / secrets and never pass on this fork. This workflow is the
# fork-friendly replacement: it builds and tests ONLY the crates that carry our
# deviations (firehose instrumentation + PulseChain support) plus a full
# `cargo check -p reth` so the whole dep graph of our binary still compiles.
#
# Report-only: it makes no branch-protection changes.

name: valve-ci

on:
  push:
    # feature/update-to-reth-2.4 is temporarily included so valve-ci runs on the
    # 2.4 branch directly: it conflicts with 2.2 `main`, so a PR can't build the
    # merge ref the pull_request event needs. Remove once 2.4 lands.
    branches: [main, feature/update-to-reth-2.4]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  valve:
    name: valve build / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Toolchain: this repo pins `rust-version = "1.93"` in Cargo.toml (no
      # rust-toolchain.toml); the upstream workflows build on `stable`. We mirror
      # that, adding rustfmt + clippy components for the lint steps below.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      # nextest, installed the same way the upstream unit.yml does.
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: nextest

      # Format check is INFORMATIONAL (`|| true`). reth is formatted with
      # NIGHTLY rustfmt (rustfmt.toml uses nightly-only options), so
      # `cargo fmt --check` on the stable toolchain reports spurious,
      # rustfmt-version-dependent diffs. The diff still prints for signal, but
      # it does not gate. The hard gates below (check, tests) stay strict.
      - name: cargo fmt (our crates, informational)
        run: |
          cargo fmt --check \
            -p reth-firehose \
            -p reth-firehose-tests \
            -p reth-pulsechain-node \
            -p reth-pulsechain-forks || true

      # Clippy runs informationally (warnings reported in the log, NOT fatal).
      # The inherited upstream + PulseChain crates carry substantial pre-existing
      # clippy debt under `-D warnings` (doc_markdown, needless_pass_by_ref_mut,
      # and more); gating on it would fail every build until that debt is burned
      # down against upstream. The hard gates below (fmt, check, tests) stay
      # strict. Flip this to `-- -D warnings` once the debt is cleared.
      - name: cargo clippy (our crates, informational)
        run: |
          cargo clippy --no-deps \
            -p reth-firehose \
            -p reth-firehose-tests \
            -p reth-pulsechain-node \
            -p reth-pulsechain-forks \
            --all-targets

      # Build the reth binary so the whole dependency graph of our build still
      # compiles end-to-end.
      - name: cargo check (reth binary)
        # reth v2.4.0 added `jit`+`gmp` to bin/reth's DEFAULT features, pulling in LLVM +
        # GMP/MPFR that the runner lacks. Check the config the fleet actually deploys:
        # --no-default-features + the v2.3-era feature set (verified to build without LLVM,
        # matches deploy.config.yaml rethBuildFeatures). Harmless on 2.2/2.3 (same set).
        run: cargo check -p reth --no-default-features --features "jemalloc,otlp,otlp-logs,reth-revm/portable,js-tracer,keccak-cache-global,asm-keccak,min-trace-logs"

      # Test our crates.
      - name: cargo nextest (our crates)
        run: |
          cargo nextest run \
            --no-fail-fast \
            -p reth-firehose \
            -p reth-firehose-tests \
            -p reth-pulsechain-node \
            -p reth-pulsechain-forks \
            -p reth-cli-commands
