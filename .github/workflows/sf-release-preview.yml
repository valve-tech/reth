name: Release preview

on:
  pull_request:
    branches:
      - "release/*"
    paths:
      - "CHANGELOG.md"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sf-release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SFRELEASER_VERSION: "v0.17.1-rc.8"

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install sfreleaser
        run: |
          curl -sSfL "https://github.com/streamingfast/sfreleaser/releases/download/$SFRELEASER_VERSION/sfreleaser_linux_x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP" sfreleaser
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Detect version
        id: detect
        run: sfreleaser release detect

      - name: Prepare release
        if: steps.detect.outputs.is_release_pr
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sfreleaser release prepare "$VERSION" --yes
