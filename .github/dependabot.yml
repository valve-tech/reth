version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    groups:
      ci-weekly:
        patterns:
          - '*'
  # Upstream reth owns every other crate. Its bumps arrive with each upstream merge, and bumping
  # them here only makes Cargo.lock conflict on the next one. Watch only the crates the fork adds.
  - package-ecosystem: cargo
    directory: /
    allow:
      - dependency-name: firehose-tracer
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    labels:
      - "A-dependencies"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 1
    groups:
      cargo-weekly:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
