# This workflow auto-publishes Reth to external package managers such as
# Homebrew when a release is published.
#
# Disabled in this fork: the upstream `release: published` trigger has no
# repository guard, so every StreamingFast Firehose release would try to bump
# the public Homebrew `reth` formula. GitHub Actions requires at least one
# event, so `workflow_dispatch` is the closest thing to "never"; the file is
# kept rather than deleted so upstream merges stay conflict-free.

name: release externally

on:
  workflow_dispatch:

permissions: {}

jobs:
  release-homebrew:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
      - name: Update Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@b12d2bc99c46444125e606142f28200ec71a1214 # v10
        with:
          token: ${{ secrets.HOMEBREW }}
          no_fork: true
          tap: paradigmxyz/brew
          formula: reth
