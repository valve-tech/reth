[package]
name = "reth-msgboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "PulseChain msgboard P2P sub-protocol manager and in-memory board"

[lints]
workspace = true

[dependencies]
reth-msgboard-types = { workspace = true, features = ["std"] }
reth-network = { workspace = true }
reth-network-api = { workspace = true }
reth-eth-wire = { workspace = true }
reth-fs-util = { workspace = true }
reth-libmdbx = { workspace = true }
reth-metrics = { workspace = true }
reth-primitives-traits = { workspace = true }
# `launch.rs` needs three provider traits and nothing else, so it names the
# crates that define them instead of `reth-provider`, which only re-exports
# them. This does not shrink the build: `reth-rpc-builder` below reaches
# `reth-provider` anyway, via `reth-rpc` → `reth-node-api`. It is here so the
# declared dependencies say what msgboard actually uses.
reth-chain-state = { workspace = true }
reth-storage-api = { workspace = true }
reth-rpc-builder = { workspace = true }

alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
alloy-serde = { workspace = true, features = ["std"] }
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
eyre = { workspace = true }
futures = { workspace = true }
humantime = { workspace = true }
jsonrpsee = { workspace = true, features = ["server", "macros"] }
metrics = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
# `test-utils` brings `TestBlockBuilder`, the only way to build a real
# `CanonStateNotification` without a running node.
reth-chain-state = { workspace = true, features = ["test-utils"] }
reth-execution-types = { workspace = true }
# `ws-client` drives a real jsonrpsee server over a socket, which is the only
# way to observe the server's per-connection subscription cap; the in-process
# `RpcModule` harness has no server config to enforce it with.
jsonrpsee = { workspace = true, features = ["ws-client"] }
metrics-util = { workspace = true, features = ["debugging"] }
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
# `test-util` gives `#[tokio::test(start_paused = true)]`, which drives the
# outbound-send timeout without the test sleeping for it.
tokio = { workspace = true, features = ["test-util"] }
