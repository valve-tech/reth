[package]
name = "reth-pulsechain-light-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage = "https://github.com/valve-tech/reth"
repository = "https://github.com/valve-tech/reth"
description = "The PulseChain beacon light-client protocol: types, Merkle checks, store and JSON, with no I/O"

[lints]
workspace = true

[features]
# The test helpers that other crates share: spec vectors, the real 369 data and signed fixtures.
test-utils = []

[dependencies]
# reth
reth-pulsechain-forks.workspace = true

# alloy
alloy-primitives = { workspace = true, features = ["serde"] }

# consensus
blst.workspace = true
ethereum_ssz.workspace = true
tree_hash.workspace = true

# misc
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
snap.workspace = true
