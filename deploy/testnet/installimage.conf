## Hetzner installimage config — PulseChain Testnet V4 reth node
## Server: 116.202.173.179 (evm943a)
## Hardware: Ryzen 7 7700, 64GB DDR5, 4x 1TB NVMe
##
## Usage (from rescue system):
##   scp installimage.conf root@<ip>:/tmp/installimage.conf
##   ssh root@<ip> "installimage -a -c /tmp/installimage.conf"
##   ssh root@<ip> reboot

DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1
DRIVE3 /dev/nvme2n1
DRIVE4 /dev/nvme3n1

SWRAID 1
SWRAIDLEVEL 0

BOOTLOADER grub

HOSTNAME evm943a

USE_KERNEL_MODE_SETTING yes

## Partitions (after mdadm RAID0 stripe across all 4 NVMes, ~3.7 TiB usable):
##   /boot/efi  256 MiB esp (UEFI requires an EFI System Partition)
##   /boot  1 GiB  ext3
##   swap   8 GiB
##   /      96 GiB ext4 (OS root)
##   /mnt/reth  rest (~3.6 TiB) ext4 (reth + lighthouse data)
PART /boot/efi esp   256M
PART /boot     ext3  1G
PART swap      swap  8G
PART /         ext4  96G
PART /mnt/reth ext4  all

IMAGE /root/.oldroot/nfs/images/Debian-bookworm-latest-amd64-base.tar.zst
