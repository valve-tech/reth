[profile.default]
retries = { backoff = "exponential", count = 2, delay = "2s", jitter = true }
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "test(general_state_tests)"
slow-timeout = { period = "1m", terminate-after = 10 }

[[profile.default.overrides]]
filter = "test(eest_fixtures)"
slow-timeout = { period = "2m", terminate-after = 10 }

# E2E tests using the testsuite framework from crates/e2e-test-utils
# These tests are located in tests/e2e-testsuite/ directories across various crates
[[profile.default.overrides]]
filter = "binary(e2e_testsuite)"
slow-timeout = { period = "2m", terminate-after = 3 }

[[profile.default.overrides]]
filter = "package(reth-era) and binary(it)"
slow-timeout = { period = "2m", terminate-after = 10 }

# Allow slower ethereum node e2e tests (p2p + blobs) to run up to 5 minutes.
[[profile.default.overrides]]
filter = "package(reth-node-ethereum) and binary(e2e)"
slow-timeout = { period = "1m", terminate-after = 5 }

# A 32-case proptest that builds a full engine harness per case: ~10 s alone on a fast machine,
# and over the 60 s default when it shares the fork's 8-core CI runner with the rest of the suite.
[[profile.default.overrides]]
filter = "package(reth-engine-tree) and test(engine_messages_keep_sender_parent_on_another_thread)"
slow-timeout = { period = "1m", terminate-after = 5 }

# Slow on the fork's CI runner, not hung. Measured in pipeline 4568: 51 s, 79 s and 58 s (about
# 5-7 s locally for the first two), against a 60 s default.
[[profile.default.overrides]]
filter = "(package(reth-engine-tree) and test(bounds_pool_results)) or (package(reth-rpc) and test(call_allowance_respects_rpc_gas_cap)) or (package(reth-provider) and test(test_prunable_receipts_logic))"
slow-timeout = { period = "1m", terminate-after = 5 }

# Heavy on the fork's CI runner, not hung. Pipeline 5171 terminated both at 60 s on all three
# tries; locally they take about 15 s (a deep storage trie checked node by node) and 14 s (a
# memory-tier heap measurement over a large fill).
[[profile.default.overrides]]
filter = "(package(reth-pulsechain-snap) and test(every_deep_storage_trie_node_is_served_and_hash_linked)) or (package(reth-pulsechain-lite) and binary(store_memory))"
slow-timeout = { period = "1m", terminate-after = 5 }

# MDBX disk tests: bound by the runner's disk, not hung. Pipeline 5262 terminated
# rotation_deletes_the_old_generation_and_bounds_disk at 60 s on all three tries (about 4 s
# locally) while its neighbours ran at 50-59 s.
[[profile.default.overrides]]
filter = "(package(reth-pulsechain-lite) and test(/^store::tests::/)) or (package(reth-pulsechain-snap) and test(/^ranges::tests::/))"
slow-timeout = { period = "1m", terminate-after = 5 }
