[profile.default]
retries = { backoff = "exponential", count = 2, delay = "2s", jitter = true }
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "test(general_state_tests)"
slow-timeout = { period = "1m", terminate-after = 10 }

[[profile.default.overrides]]
filter = "test(eest_fixtures)"
slow-timeout = { period = "2m", terminate-after = 10 }

# E2E tests using the testsuite framework from crates/e2e-test-utils
# These tests are located in tests/e2e-testsuite/ directories across various crates
[[profile.default.overrides]]
filter = "binary(e2e_testsuite)"
slow-timeout = { period = "2m", terminate-after = 3 }

[[profile.default.overrides]]
filter = "package(reth-era) and binary(it)"
slow-timeout = { period = "2m", terminate-after = 10 }

# Allow slower ethereum node e2e tests (p2p + blobs) to run up to 5 minutes.
[[profile.default.overrides]]
filter = "package(reth-node-ethereum) and binary(e2e)"
slow-timeout = { period = "1m", terminate-after = 5 }

# A 32-case proptest that builds a full engine harness per case: ~10 s alone on a fast machine,
# and over the 60 s default when it shares the fork's 8-core CI runner with the rest of the suite.
[[profile.default.overrides]]
filter = "package(reth-engine-tree) and test(engine_messages_keep_sender_parent_on_another_thread)"
slow-timeout = { period = "1m", terminate-after = 5 }

# Both take 4-7 s locally but passed the 60 s default on the CI runner on all three tries. The
# longer limit shows whether they are slow there or hung: a hang still fails.
[[profile.default.overrides]]
filter = "(package(reth-engine-tree) and test(bounds_pool_results)) or (package(reth-rpc) and test(call_allowance_respects_rpc_gas_cap))"
slow-timeout = { period = "1m", terminate-after = 5 }
